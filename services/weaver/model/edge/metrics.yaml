    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

  - id: metric.edge.conveyor.motor.current
    type: metric
    metric_name: edge.conveyor.motor.current
    brief: "Conveyor motor current."
    instrument: gauge
    unit: "A"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

  - id: metric.edge.conveyor.motor.voltage
    type: metric
    metric_name: edge.conveyor.motor.voltage
    brief: "Conveyor motor voltage."
    instrument: gauge
    unit: "V"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

  - id: metric.edge.conveyor.frequency
    type: metric
    metric_name: edge.conveyor.frequency
    brief: >
      Conveyor drive frequency. Expected range: 0–50 Hz. Currently anomalous:
      values observed in range -5 to 5.
    instrument: gauge
    unit: "Hz"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id
      - ref: edge.signal.status

  - id: metric.edge.conveyor.temperature
    type: metric
    metric_name: edge.conveyor.temperature
    brief: >
      Conveyor motor temperature. Currently reads all zeros —
      under investigation.
    instrument: gauge
    unit: "Cel"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id
      - ref: edge.signal.status

  - id: metric.edge.conveyor.frequency.reference
    type: metric
    metric_name: edge.conveyor.frequency.reference
    brief: "Conveyor frequency reference setpoint."
    instrument: gauge
    unit: "Hz"
    stability: development
    attributes:
      - ref: edge.vehicle.id

  # ---------------------------------------------------------------------------
  # OPERATOR CONTROLS
  # ---------------------------------------------------------------------------
  - id: metric.edge.controls.tram.pedal.position
    type: metric
    metric_name: edge.controls.tram.pedal.position
    brief: "Tram foot pedal position (0–100%)."
    instrument: gauge
    unit: "%"
    stability: development
    attributes:
      - ref: edge.vehicle.id

  - id: metric.edge.controls.tram.pedal.reverse
    type: metric
    metric_name: edge.controls.tram.pedal.reverse
    brief: "Tram pedal reverse (1 = reverse active, 0 = inactive)."
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id

  - id: metric.edge.controls.conveyor.switch.position
    type: metric
    metric_name: edge.controls.conveyor.switch.position
    brief: >
      Conveyor switch position (0–100%). Currently anomalous: values
      observed in range 10–72.
    instrument: gauge
    unit: "%"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.signal.status

  - id: metric.edge.controls.conveyor.switch.reverse
    type: metric
    metric_name: edge.controls.conveyor.switch.reverse
    brief: "Conveyor switch reverse (1 = reverse active, 0 = inactive)."
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id

  - id: metric.edge.controls.tram.torque.reference
    type: metric
    metric_name: edge.controls.tram.torque.reference
    brief: >
      Tram torque reference setpoint.  The PLC stores this as
      a 32-bit float converted to a 16-bit integer with no
      documented physical unit.  Recorded as dimensionless
      until the VFD commissioning data confirms the native
      unit.
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id

  # ---------------------------------------------------------------------------
  # VEHICLE KINEMATICS
  # ---------------------------------------------------------------------------
  - id: metric.edge.vehicle.speed
    type: metric
    metric_name: edge.vehicle.speed
    brief: >
      Vehicle speed as a dimensionless scaled integer.  The raw
      PLC value is MPH multiplied by 10 (e.g. 15 represents
      1.5 MPH).  A proper UCUM unit is not used because the
      source encoding is a fixed-point artefact, not a true
      physical quantity.  Currently anomalous: values are 0 or
      1 only.  Fix planned for next release.
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.signal.status

  - id: metric.edge.vehicle.steering.angle
    type: metric
    metric_name: edge.vehicle.steering.angle
    brief: >
      Steering angle in degrees, calculated from the difference in left and
      right traction motor speeds.
    instrument: gauge
    unit: "deg"
    stability: development
    attributes:
      - ref: edge.vehicle.id

  - id: metric.edge.vehicle.orientation
    type: metric
    metric_name: edge.vehicle.orientation
    brief: >
      Vehicle heading in degrees. Currently arbitrary — zeroing procedure
      is in development.
    instrument: gauge
    unit: "deg"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.signal.status

