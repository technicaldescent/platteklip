# Internal metrics endpoint for OTel Collector nginx receiver.
#
# Plain HTTP on port 8081, bound to localhost only.  This server
# block is never exposed on net-edge — no host port mapping exists
# in compose.yaml.  The OTel Collector reaches it via the shared
# net-ingest network.
#
# stub_status exposes: active connections, accepts, handled,
# requests, reading, writing, waiting.

server {
    listen [::]:8081;
    server_name _;

    # Suppress security headers — internal endpoint only.
    # The http{} scope headers are inherited but harmless.

    access_log off;

    location /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
