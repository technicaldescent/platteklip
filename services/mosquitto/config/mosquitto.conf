# ###########################################################################
# GLOBAL SETTINGS
# ###########################################################################
user mosquitto

# Persist session state / queued QoS1/2 messages to disk.
persistence true
persistence_location /mosquitto/data
persistence_file mosquitto.db
autosave_interval 15

# FLOW CONTROL / QUEUING
# MQTT inflight applies to QoS1/2 messages.
max_inflight_messages 2048

# Prevent unbounded memory growth.
# NOTE: max_queued_bytes is BYTES.
max_queued_messages 100000
max_queued_bytes 1073741824

# ###########################################################################
# LOGGING
# ###########################################################################
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ###########################################################################
# LISTENER 8883 (External / mTLS)
# ###########################################################################
listener 8883
socket_domain ipv6
protocol mqtt

allow_anonymous false
require_certificate true
use_identity_as_username true

cafile /run/secrets/ca.crt
certfile /run/secrets/tls_certificate.crt
keyfile /run/secrets/tls_private_key.key
tls_version tlsv1.3
