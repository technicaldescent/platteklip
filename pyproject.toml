# =================================================================
# Normative References
# =================================================================
#
# This project targets conformance with the following
# standards and regulations.  Control mappings are
# maintained in the Gemara artefacts under gemara/.
#
# Regulatory
# ----------
# EU Cyber Resilience Act (CRA)
#     Product security obligations for connected
#     devices.  Vulnerability handling, incident
#     reporting, and SBOM requirements.
# EU Artificial Intelligence Act (AI Act)
#     Risk classification and transparency for ML
#     components.
# General Data Protection Regulation (GDPR)
#     Personal data processing constraints for
#     telemetry payloads.
#
# Security frameworks
# -------------------
# IEC 62443-3-3:2013
#     System security requirements for industrial
#     automation and control systems.  Primary
#     guidance for the Gemara control catalogue.
# ISO/IEC 27001:2022
#     Information security management system.
# ISO/IEC 27002:2022
#     Information security controls reference.
# NIST SP 800-53 Rev 5
#     Security and privacy controls for information
#     systems and organisations.
# CIS Docker Benchmark v1.7.0
#     Container runtime and image hardening.
#     Enforced via OPA policies in
#     requirements/security/.
#
# AI/ML governance
# ----------------
# ISO/IEC 42001:2023
#     AI management system requirements.
#
# Supply chain integrity
# ----------------------
# SLSA v1.1 Level 3
#     Build provenance and source integrity.
#     Enforced via Dagger pipeline attestations.
# SPDX 3.1
#     Software bill of materials format.
# in-toto / witness
#     Attestation framework for build steps.
# Sigstore (cosign, Rekor, Fulcio)
#     Keyless signing and transparency log.
#
# Development process
# -------------------
# Conventional Commits 1.0.0
#     Commit message format for automated
#     versioning and changelog generation.
# Semantic Versioning 2.0.0
#     Version numbering scheme.
# SPEC 0 (Scientific Python)
#     Python and dependency version support
#     policy.
#
# Data governance
# ---------------
# MLCommons Croissant 1.1
#     Dataset metadata format.

# =================================================================
# Build Automation
# =================================================================

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "pip>=26.0.0",
]
build-backend = "hatchling.build"

# =================================================================
# Project Metadata
# =================================================================

[project]
name = "platteklip"
dynamic = ["version"]
description = "Zero-Trust Telemetry Gateway and Observability Plane"
requires-python = ">=3.14"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    {name = "technical descent"},
]
maintainers = [
    {name = "Raymond Ellis", email = "raymond.ellis@gmail.com"},
]

keywords = [
    "data-engineering",
    "devsecops",
    "open-telemetry",
    "scada",
]

classifiers = [
    "Private :: Do Not Upload",

    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Natural Language :: English",

    "Operating System :: POSIX",

    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Topic :: Scientific/Engineering",

    "Typing :: Typed",
]

# Core dependencies
dependencies = [
]

[project.optional-dependencies]

dev = [
    "bandit>=1.9.0",
    "behave>=1.3.0",
    "black>=26.1.0",
    "codespell>=2.4.0",
    "coverage>=7.13.0",
    "detect-secrets>=1.5.0",
    "flake8>=7.3.0",
    "Flake8-pyproject>=1.2.0",
    "hypothesis>=6.151.0",
    "interrogate>=1.7.0",
    "mlcroissant>=1.0.0",
    "mypy>=1.19.0",
    "opa-python-client>=2.0.0",
    "pipdeptree>=2.31.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.0",
    "pylint>=4.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.0",
    "reuse>=6.2.0",
    "safety>=3.7.0",
    "python-semantic-release>=10.5.0",
    "sigstore>=4.2.0",
    "tryceratops>=2.4.0",
    "xenon>=0.9.3",
]

docs = [
    "pyyaml>=6.0.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.5.0",
    "sphinxcontrib-bibtex>=2.6.0",
    "sphinx-jsonschema>=1.19.0",
    "myst-parser>=5.0.0",
]

observability = [
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-distro>=0.59b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
    "opentelemetry-exporter-richconsole>=0.59b0",
    "opentelemetry-instrumentation>=0.59b0",
    "opentelemetry-instrumentation-logging>=0.59b0",
]

torch = [
    "accelerate>=1.12.0",
    "model-signing>=1.1.0",
    "onnx>=1.20.0",
    "safetensors>=0.7.0",
    "torch>=2.10.0",
    "torchmetrics>=1.8.0",
]

[project.urls]
homepage = "https://github.com/technicaldescent/platteklip"
documentation = "https://github.com/technicaldescent/platteklip/README.md"
source = "https://github.com/technicaldescent/platteklip"
issues = "https://github.com/technicaldescent/platteklip/issues"
changelog = "https://github.com/technicaldescent/platteklip/blob/main/CHANGELOG.md"
security = "https://github.com/technicaldescent/platteklip/blob/main/SECURITY.md"
contributing = "https://github.com/technicaldescent/platteklip/blob/main/CONTRIBUTING.md"
discussion = "https://github.com/technicaldescent/platteklip/discussions"


# =================================================================
# Build Configuration
# =================================================================

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build]
include = [
    "src/platteklip",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platteklip"]
# Force reproducible builds for binary hashing (SI-7).
reproducible = true


# =================================================================
# Hatch Environments
# =================================================================
#
# These environments support LOCAL DEVELOPMENT only.
# CI orchestration, image builds, SBOM generation,
# artefact signing, and attestation are owned by the
# Dagger pipeline module (dagger/src/main.py).  Each
# Dagger stage wraps its command with `witness run` to
# produce in-toto attestations.
#
# Local shortcuts:
#
#   hatch run test:unit          pytest unit tests
#   hatch run test:performance   pytest performance
#   hatch run acceptance:run     behave BDD features
#   hatch run policy:test        OPA policy tests
#   hatch run policy:lint        Regal linter
#   hatch run policy:eval        OPA deny eval
#   hatch run quality:check      static analysis
#   hatch run evidence:static    evaluate_controls
#   hatch run evidence:collect   collect_evidence
#   hatch run docs:build         Sphinx docs
#
# Quick checks:
#
#   hatch run test:unit          just unit tests
#   hatch run quality:spelling   just codespell
#   hatch run evidence:gaps      structural gaps
#

# -----------------------------------------------------------------
# test — pytest (unit + performance)
# -----------------------------------------------------------------

[tool.hatch.envs.test]
dependencies = [
    ".dev",
    ".observability",
]

[tool.hatch.envs.test.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.test.scripts]
unit = "pytest tests/unit {args}"
performance = "pytest tests/performance -m performance {args}"
all = [
    "unit",
    "performance",
]

# -----------------------------------------------------------------
# acceptance — behave BDD tests
# -----------------------------------------------------------------

[tool.hatch.envs.acceptance]
dependencies = [
    ".dev",
    ".observability",
]

[tool.hatch.envs.acceptance.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.acceptance.scripts]
run = "behave {args}"

# -----------------------------------------------------------------
# policy — OPA and Regal
# -----------------------------------------------------------------
# Requires opa and regal on PATH (not pip-installable).
# Install via:
#   brew install opa regal
# or download from:
#   https://www.openpolicyagent.org/docs/latest/
#   https://docs.styra.com/regal#getting-started

[tool.hatch.envs.policy]
detached = true

[tool.hatch.envs.policy.scripts]
test = [
    "opa test requirements/security/container_runtime/policy/ -v",
    "opa test requirements/security/container_image/policy/ -v",
    "opa test requirements/security/use_control/policy/ -v",
    "opa test requirements/development/semconv/policy/ -v",
]
lint = "regal lint requirements/ policy/"
eval-compose = """opa eval \
    --data requirements/security/container_runtime/policy/ \
    --data requirements/security/container_runtime/data/ \
    --input compose.yaml \
    'data.main.deny' \
    --format=json"""
eval-dockerfile = """find services/ -name Dockerfile \
    -exec sh -c ' \
        echo ""; \
        echo "--- $1 ---"; \
        conftest test "$1" \
            --policy requirements/security/container_image/policy/ \
            --data requirements/security/container_image/data/ \
            --output json' _ {{}} \\;"""
eval = [
    "mkdir -p gemara/evidence",
    """opa eval \
        --data requirements/security/container_runtime/policy/ \
        --data requirements/security/container_runtime/data/ \
        --input compose.yaml \
        'data.main.deny' \
        --format=json > gemara/evidence/opa-results.json""",
]
all = [
    "test",
    "lint",
]

# -----------------------------------------------------------------
# evidence — Gemara L5 evaluation and evidence collection
# -----------------------------------------------------------------

[tool.hatch.envs.evidence]
dependencies = [
    "pyyaml>=6.0.0",
]

[tool.hatch.envs.evidence.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.evidence.scripts]
static = """python gemara/evidence/evaluate_controls.py \
    . gemara/controls/platteklip-controls.yaml \
    > gemara/evidence/static-eval.yaml"""
collect = """python gemara/evidence/collect_evidence.py \
    --catalog gemara/controls/platteklip-controls.yaml \
    --catalog gemara/controls/cis-docker-controls.yaml \
    --guidance gemara/guidance/iec-62443-3-3.yaml \
    --guidance gemara/guidance/cis-docker-benchmark.yaml \
    --static-eval gemara/evidence/static-eval.yaml \
    --junit tests/test-results.xml \
    --cucumber tests/cucumber.json \
    --opa-json gemara/evidence/opa-results.json \
    --output gemara/evidence/evaluation-log.yaml \
    --matrix gemara/evidence/traceability.yaml"""
gaps = "bash scripts/coverage_gaps.sh requirements/security"
all = [
    "static",
    "collect",
]

# -----------------------------------------------------------------
# quality — static analysis
# -----------------------------------------------------------------

[tool.hatch.envs.quality]
dependencies = [
    ".dev",
]

[tool.hatch.envs.quality.scripts]
spelling = "codespell"
security = "bandit -c pyproject.toml -r src"
formatting = "black --check --diff src tests requirements"
secrets = "detect-secrets scan"  # pragma: allowlist secret
lint = "flake8 src tests"
docstrings = "interrogate -vv ."
types = "mypy"
complexity = "xenon --max-absolute B --max-modules A --max-average A src"
exceptions = "tryceratops check src tests"
vulnerabilities = "pip-audit"
check = [
    "spelling",
    "security",
    "formatting",
    "secrets",
    "lint",
    "docstrings",
    "types",
    "complexity",
    "exceptions",
]

# -----------------------------------------------------------------
# coverage — test coverage reporting
# -----------------------------------------------------------------

[tool.hatch.envs.coverage]
dependencies = [
    ".dev",
    ".observability",
]

[tool.hatch.envs.coverage.env-vars]
PYTHONPATH = "src"

[tool.hatch.envs.coverage.scripts]
report = [
    "coverage run -m pytest tests/unit",
    "coverage xml -o tests/coverage.xml",
    "coverage report",
]

# -----------------------------------------------------------------
# docs — Sphinx documentation
# -----------------------------------------------------------------

[tool.hatch.envs.docs]
dependencies = [".docs"]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W -b html docs/source docs/build/html"
serve = "sphinx-autobuild docs/source docs/build/html"
clean = "rm -rf docs/build"

[tool.hatch.envs.hatch-static-analysis]
installer = "pip"


# =================================================================
# Release Management and Security
# =================================================================
#
# Version tags are created by python-semantic-release
# from Conventional Commits.  Tags are signed via SSH
# by gitconfig (tag.gpgSign, gpg.format, user.signingKey).
#
# semantic-release does NOT create a release commit.
# hatch-vcs reads the version directly from the signed
# git tag.  This keeps the release process VCS-independent
# and ensures every tag in the history is verified.
#
# The Dagger pipeline reads the tag via hatch-vcs,
# applies it to container image tags, and signs the
# images with cosign (Sigstore keyless).  Syft generates
# an SPDX SBOM for each image and cosign attaches it as
# an in-toto attestation.
#
# Local release workflow:
#
#   ssh-add ~/.ssh/ed25519
#   semantic-release version
#   git push --follow-tags

[tool.semantic_release]
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true
upload_to_pypi = false
upload_to_release = true
commit = false
tag_format = "v{version}"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "revert",
    "style",
    "test",
]
major_tags = ["BREAKING", "BREAKING CHANGE"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%%"
block_end_string = "%%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.branches.main]
match = "main"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.alpha]
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.branches.release]
match = "release/.*"
prerelease = true
prerelease_token = "rc"
bump_patch_without_tag = false

[tool.sigstore]
enabled = true
identity = "https://github.com/technicaldescent/platteklip"
rekor_url = "https://rekor.sigstore.dev"
fulcio_url = "https://fulcio.sigstore.dev"

# =================================================================
# Linting and Security
# =================================================================

[tool.bandit]
exclude_dirs = []
targets = ["src"]
aggregate = "file"
confidence-level = "MEDIUM"
severity-level = "LOW"

[tool.black]
preview = true

[tool.codespell]
check-filenames = true
check-hidden = false
skip = [
    "**/*.bib",
    "*/build",
    "./.codespell/*",
    "./coverage.xml",
    "./dist",
    "**/gherkin-languages.json",
    "**/i18n",
    "./k8s",
    "LICENSE",
    "./LICENSES",
    "**/grafana/dashboards",
    "**/nifi/",
    "**/weaver/semantic-conventions",
]
dictionary = [
    ".codespell/dictionary_en.txt",
    ".codespell/dictionary_engineering.txt",
    ".codespell/dictionary_style.txt",
    ".codespell/dictionary_units.txt",
    "-",
]
ignore-words = ".codespell/codespellignore"

[tool.detect-secrets]
exclude-lines = [
    "EXAMPLE=",
    "SAMPLE_",
]

[tool.flake8]
min-python-version = 3.14
# Compatible with Black.
max-line-length = 88

# Cyclomatic complexity threshold.
# NASA Software Assurance and Software Safety maximum
# is 15.  Basis Path Coverage would require no fewer
# than 15 tests.
max-complexity = 15

# Rules that conflict with Black.
# E203: whitespace before ':'
# W503: line break before binary operator
ignore = ["E203", "W503", "H601"]
exclude = [
    ".dagger",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]
per-file-ignores = [
    "tests/*:D403,E800,FNE005,FNE007,PT009,PT027,SCS108,SIM117",
]

[tool.mypy]
mypy_path = ["src"]
files = ["src", "tests"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
namespace_packages = true
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
# Silence "Untyped decorator" errors for behave steps.
module = "requirements.*"
disallow_untyped_decorators = false

[tool.pip-audit]
format = "json"
desc = true

[tool.pylint.main]
fail-under = 9.95
load-plugins = []
max-line-length = 88

[tool.safety]
continue-on-error = false

[tool.tryceratops]
exclude = [
    "src/platteklip/vendored/*",
    "docs/*",
    "scripts/*",
    "benchmarks/*",
]
fix = false
ignore = [
    "TRY002",
    "TRY003",
    "TRY201",
    "TRY400",
]
include_exit_codes = true
verbose = true

[tool.xenon]
max-absolute = "B"
max-modules = "A"
max-average = "A"
exclude = [
    "src/platteklip/vendored/*",
]

# =================================================================
# Testing
# =================================================================

[tool.behave]
paths = [
    "requirements/security",
    "requirements/functional/ingestion",
    "requirements/functional/observation",
    "requirements/functional/telemetry",
]
show_skipped = true
summary = true
stderr_capture = true
stdout_capture = true

[tool.coverage.run]
branch = true
parallel = true
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.interrogate]
exclude = [
    "build",
    "docs",
    "pre_commit_hooks",
    "requirements",
    "services",
    "tests",
]
fail-under = 98
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-module = false
ignore-nested-classes = false
ignore-nested-functions = false
ignore-overloaded-functions = false
ignore-private = false
ignore-property-decorators = false
ignore-semiprivate = false
ignore-setters = false
omit-covered-files = false
quiet = false
style = "sphinx"
verbose = 2

[tool.pytest.ini_options]
addopts = """
    -ra -q
    --junitxml=tests/test-results.xml
    -m "not performance"
"""
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
    "error::ImportWarning",
    "error::PendingDeprecationWarning",
    "error::ResourceWarning",
]
log_level = "INFO"
markers = [
    "acceptance: test-level to determine whether to accept the system",
    "adverserial: creation and execution of adversarial examples",
    "control(ar_id): link test to a Gemara L2 assessment requirement ID",
    "health: health tests for running processes",
    "integration: interaction-level tests between components or systems",
    "performance: performance and benchmark tests",
    "regression: tests for fixed bugs and refactoring",
    "unit: unit-level tests for individual components",
]
minversion = "9.0.0"
python_files = ["test_*.py"]
python_functions = "test_*"
pythonpath = ["src", "."]
testpaths = [
    "requirements",
    "tests",
]
xfail_strict = true
