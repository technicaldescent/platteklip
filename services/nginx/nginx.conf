# GLOBAL SECURITY DIRECTIVES
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /run/nginx.pid;

# Load necessary security modules (if compiled)
# load_module modules/ngx_http_headers_more_module.so; # For header control
# load_module modules/ngx_http_modsecurity_module.so;  # For WAF

events {
    worker_connections 256;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;          # Hide version information

    # OPEN TELEMETRY SEMANTIC LOG FORMAT
    log_format otel_custom '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'client.address="$remote_addr" '
                          'http.request.method="$request_method" '
                          'url.path="$request_uri" '
                          'network.protocol.name="$server_protocol" '
                          'user_agent.original="$http_user_agent" '
                          'http.response.status_code="$status" '
                          'request_time=$request_time '
                          'upstream_response_time=$upstream_response_time';

    # SECURITY HEADERS
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'";
    add_header Referrer-Policy "no-referrer";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), serial=()";

    # TLS HARDENING (Industrial Grade)
    ssl_protocols TLSv1.3;                   # TLS 1.3 only for strongest security
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';  # TLS 1.3 only ciphers
    ssl_ecdh_curve X448:secp521r1:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # DH Parameters (4096-bit for perfect forward secrecy)
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # OCSP Stapling
    resolver 192.168.1.1 10.0.0.1 valid=300s;  # Internal DNS servers
    resolver_timeout 5s;

    # LOGGING CONFIGURATION
    access_log /var/log/nginx/access.log otel_custom buffer=256k flush=1m;
    error_log /var/log/nginx/error.log info;

    # PERFORMANCE OPTIMIZATIONS
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_body_buffer_size 128k;
    client_max_body_size 10m;

    # RATE LIMITING & ACCESS CONTROL
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # INCLUDE SERVER CONFIGURATIONS
    include /etc/nginx/conf.d/*.conf;
}
