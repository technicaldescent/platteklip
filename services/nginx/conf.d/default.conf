server {
    listen 443 ssl;
    server_name _;

    # SSL CERTIFICATES (Client certificate authentication)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;  # Client certificates
    ssl_verify_client on;                            # Require

    # STRICT TRANSPORT SECURITY
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

    # HEALTH CHECK ENDPOINT (With access restrictions)
    location /health {
        allow 192.168.1.0/24;   # Internal network only
        allow 10.0.0.0/8;       # Additional internal range
        deny all;               # Block all others

        access_log off;         # Disable logging for health checks
        add_header 'Content-Type' 'application/json';
        return 200 '{"status":"UP","timestamp":"$time_iso8601"}';
        default_type application/json;
    }

    # DEFAULT DENY ALL POLICY
    location / {
        # Client certificate authentication required
        satisfy all;            # Require both client cert and IP whitelist

        allow 192.168.1.0/24;   # Internal network only
        allow 10.0.0.0/8;       # Additional internal range
        deny all;               # Block all others

        # Enhanced security headers
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';";
        add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

        # Return 444 instead of 403 to avoid information leakage
        return 444;             # Silent drop connection
    }

    # BLOCK HIDDEN FILES AND DIRECTORIES
    location ~ /\. {
        deny all;
        return 404;
    }

    # BLOCK SENSITIVE FILES
    location ~ /(README|LICENSE|CHANGELOG|COPYING|Dockerfile) {
        deny all;
        return 404;
    }

    # RATE LIMITING APPLICATION
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn addr 10;  # Maximum 10 connections per IP

        # Additional security controls
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Application proxy pass
        # proxy_pass http://backend;

        return 444;  # Placeholder - replace with actual proxy pass
    }
}
