# ============================================================================
# HTTP → HTTPS REDIRECT
# ============================================================================
server {
    listen      [::]:80 ipv6only=off;
    server_name _;
    return 301 https://$host$request_uri;
}

# ============================================================================
# MAIN SECURE GATEWAY
#
# All upstreams use variable-based proxy_pass (set $var / proxy_pass
# https://$var) so that DNS resolution is deferred to request time. This
# prevents nginx from failing to start when a backend is unavailable and
# eliminates implicit startup ordering dependencies between services.
#
# nginx will return 502 if a backend is unreachable at request time, which
# is the correct behaviour. Service availability is managed by compose
# profiles and health checks, not by nginx startup dependencies.
#
# proxy_ssl_* directives are set at server{} scope (not http{}) to ensure
# the client certificate is presented reliably for variable upstreams.
# ============================================================================
server {
    listen      [::]:443 ssl ipv6only=off;
    server_name devops.local localhost;

    # -------------------------------------------------------------------------
    # TLS — INBOUND
    # ssl_verify_client is off: users authenticate via Keycloak, not via
    # client certificates at the TLS layer.
    # -------------------------------------------------------------------------
    ssl_certificate        /run/secrets/tls_certificate.crt;
    ssl_certificate_key    /run/tls/tls_private_key.key;
    ssl_client_certificate /run/secrets/ca.crt;
    ssl_verify_client      off;

    # -------------------------------------------------------------------------
    # TLS — OUTBOUND (proxy to HTTPS upstreams)
    # Set at server{} scope so that proxy_ssl_certificate is applied to
    # variable-based upstreams. All internal services share the same private
    # CA and the same service certificate/key pair issued by that CA.
    # -------------------------------------------------------------------------
    proxy_ssl_certificate         /run/secrets/tls_certificate.crt;
    proxy_ssl_certificate_key     /run/tls/tls_private_key.key;
    proxy_ssl_trusted_certificate /run/secrets/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_server_name         on;

    # -------------------------------------------------------------------------
    # PROXY DEFAULTS
    # -------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Required for WebSocket upgrades (NiFi UI, Grafana Live).
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";

    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # -------------------------------------------------------------------------
    # NIFI
    # NiFi requires X-Proxy-* headers for host validation and CSRF protection.
    # proxy_buffering off is required for Server-Sent Events used by the NiFi
    # UI bulletin board and live data view.
    # -------------------------------------------------------------------------
    location /nifi/ {
        set $upstream_nifi nifi:8443;
        proxy_pass https://$upstream_nifi;

        # Repeat server-level headers: any proxy_set_header in a location
        # block replaces (not merges) all server-level proxy_set_header
        # directives. Without these, Host defaults to the variable value
        # ("nifi:8443"), which NiFi rejects as an invalid host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header X-ProxyScheme      https;
        proxy_set_header X-ProxyHost        $host;
        proxy_set_header X-ProxyPort        443;
        proxy_set_header X-ProxyContextPath /nifi;

        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /nifi-api/ {
        set $upstream_nifi_api nifi:8443;
        proxy_pass https://$upstream_nifi_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header X-ProxyScheme      https;
        proxy_set_header X-ProxyHost        $host;
        proxy_set_header X-ProxyPort        443;
        proxy_set_header X-ProxyContextPath /nifi;

        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # -------------------------------------------------------------------------
    # JAEGER
    # Jaeger v2 enforces mTLS on port 16686. The client certificate is
    # presented via proxy_ssl_certificate set at server{} scope above.
    #
    # Jaeger serves all static assets pre-compressed (.gz only). The browser's
    # Accept-Encoding header is forwarded naturally, so Jaeger returns the
    # correct gzipped asset with appropriate Content-Type and
    # Content-Encoding headers.
    #
    # Three location blocks are required because the Jaeger UI HTML is served
    # at / with <base href="/">, so static assets and API calls are made to
    # /static/ and /api/ directly — not prefixed with /jaeger/.
    #
    #   /jaeger/  — UI entry point. Rewrite strips the /jaeger prefix so
    #               browser GET /jaeger/search → Jaeger receives GET /search.
    #   /static/  — JS/CSS/icon assets.
    #   /api/     — Jaeger query API called by the JS application.
    # -------------------------------------------------------------------------
    location /jaeger/ {
        set $upstream_jaeger jaeger:16686;
        rewrite ^/jaeger/(.*)$ /$1 break;
        proxy_pass https://$upstream_jaeger;
    }

    location /static/ {
        set $upstream_jaeger_static jaeger:16686;
        proxy_pass https://$upstream_jaeger_static;
    }

    location /api/ {
        set $upstream_jaeger_api jaeger:16686;
        proxy_pass https://$upstream_jaeger_api;
    }

    # -------------------------------------------------------------------------
    # PROMETHEUS
    # Prometheus serves HTTPS with mTLS via --web.config.file. The route
    # prefix /prometheus is set by --web.external-url, so no rewrite is
    # needed — Prometheus expects requests at /prometheus/*.
    # -------------------------------------------------------------------------
    location /prometheus/ {
        set $upstream_prometheus prometheus:9090;
        proxy_pass https://$upstream_prometheus;
    }

    # -------------------------------------------------------------------------
    # GRAFANA
    # GF_SERVER_ROOT_URL and GF_SERVER_SERVE_FROM_SUB_PATH must be set in
    # compose.yaml for the /grafana/ subpath to work correctly.
    # Grafana is configured with GF_SERVER_PROTOCOL=https and uses the same
    # private CA certificate/key pair as all other internal services.
    # -------------------------------------------------------------------------
    location /grafana/ {
        set $upstream_grafana grafana:3000;
        proxy_pass https://$upstream_grafana;

        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # SECURITY LOCATIONS
    # -------------------------------------------------------------------------

    # Block all dot-file access except .well-known (ACME challenge etc.)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Health endpoint: restricted to loopback and Docker ULA ranges.
    # IPv4 private ranges are omitted: internal networks are IPv6-only
    # (enable_ipv4: false) so those ranges will never match in practice.
    # Access is logged for audit-trail compliance (ISO 27002 A.8.15).
    location /health {
        allow 127.0.0.1;
        allow ::1;
        allow fd00::/8;
        deny  all;

        default_type application/json;
        return 200 '{"status":"UP","gateway":"nginx-secure"}';
    }

    # Default: 503 when no upstream matches.
    # A redirect to a named upstream is intentionally avoided: the catch-all
    # must not trigger DNS resolution for services that may not be running,
    # and must not misroute asset requests from other UIs.
    location / {
        return 503 "Service unavailable";
    }
}
