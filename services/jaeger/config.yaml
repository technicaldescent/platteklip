---
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4317"
        tls:
          cert_file: /run/secrets/tls_certificate.crt
          key_file:  /run/tls/tls_private_key.key
          client_ca_file: /run/secrets/ca.crt
          reload_interval: 15m

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 60
    spike_limit_percentage: 10
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  jaeger_storage_exporter:
    trace_storage: local

extensions:
  healthcheckv2:
    endpoint: "[::1]:13133"

  jaeger_query:
    http:
      endpoint: "[::]:16686"
      tls:
        cert_file: /run/secrets/tls_certificate.crt
        key_file:  /run/tls/tls_private_key.key
        client_ca_file: /run/secrets/ca.crt
        reload_interval: 15m
    grpc:
      endpoint: "[::]:16685"
      tls:
        cert_file: /run/secrets/tls_certificate.crt
        key_file:  /run/tls/tls_private_key.key
        client_ca_file: /run/secrets/ca.crt
        reload_interval: 15m
    storage:
      traces: local

  jaeger_storage:
    backends:
      local:
        memory:
          max_traces: 50000

service:
  extensions: [healthcheckv2, jaeger_query, jaeger_storage]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [jaeger_storage_exporter]
