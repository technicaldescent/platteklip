---
target: all
auth_enabled: false

# 1. Disable "Phone Home" analytics
analytics:
  reporting_enabled: false

# 2. Internal Tracing
tracing:
  enabled: true

server:
  # --- HTTP (Ingestion from Collector) ---
  # TLS is ENABLED here so the Collector can push logs securely via mTLS
  http_listen_address: "::"
  http_listen_port: 3100
  http_tls_config:
    cert_file: /run/secrets/tls_certificate.crt
    key_file: /run/secrets/tls_private_key.key
    client_ca_file: /run/secrets/ca.crt
    client_auth_type: RequireAndVerifyClientCert

  # --- gRPC (Internal Cluster Communication) ---
  # TLS is DISABLED here because internal components (Querier <-> Ingester)
  # communicate over localhost loopback, which failed with TLS enabled.
  grpc_listen_address: "::"
  grpc_listen_port: 9095

# 3. IPv6 Clustering
# Forces memberlist to bind to IPv6
memberlist:
  bind_addr: ["::"]
  bind_port: 7946

common:
  # 4. IPv6 Identity
  # Tells Loki that "myself" is the IPv6 localhost address
  instance_addr: "::1"
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

# Force ALL component rings off memberlist (single-node mode)
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
    final_sleep: 0s
  chunk_idle_period: 30m
  chunk_target_size: 1572864
  chunk_encoding: snappy
  max_chunk_age: 2h

distributor:
  ring:
    kvstore:
      store: inmemory

ruler:
  ring:
    kvstore:
      store: inmemory

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 5m
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

schema_config:
  configs:
    - from: 2026-03-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  unordered_writes: true
  retention_period: 2h

  # 5. OpenTelemetry Support
  # Allows ingestion of OTel resource attributes (service.name, etc.)
  allow_structured_metadata: true
