# Security Standards and Benchmarks Applied:
# - CIS NGINX Benchmark v2.1.0
# - NIST SP 800-52 Rev 2: TLS Guidelines
# - ISO/IEC 27002:2022 A.8.15 (Logging), A.8.20 (Network Security)

worker_processes auto;
error_log /var/log/nginx/error.log warn;

# Run as non-root: pid written to /tmp (tmpfs-backed in compose.yaml)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # CIS 2.1.1: Suppress version disclosure in Server header and error pages.
    server_tokens off;

    # -------------------------------------------------------------------------
    # OPENTELEMETRY SEMANTIC LOG FORMAT
    # Attribute names conform to OTel Semantic Conventions 1.34:
    #   https://opentelemetry.io/docs/specs/semconv/http/http-spans/
    # -------------------------------------------------------------------------
    log_format otel_custom
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'client.address="$remote_addr" '
        'http.request.method="$request_method" '
        'url.path="$request_uri" '
        'network.protocol.name="$server_protocol" '
        'user_agent.original="$http_user_agent" '
        'http.response.status_code="$status" '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time';

    # -------------------------------------------------------------------------
    # SECURITY HEADERS
    # Applied globally; individual server blocks may tighten further.
    # -------------------------------------------------------------------------

    # HSTS: 2-year max-age. Do not enable preload unless the domain is
    # submitted to the HSTS preload list.
    add_header Strict-Transport-Security
        "max-age=63072000; includeSubDomains" always;

    add_header X-Content-Type-Options  "nosniff"    always;

    # SAMEORIGIN prevents clickjacking from external origins while still
    # allowing the NiFi and Grafana UIs to load in same-origin iframes.
    add_header X-Frame-Options         "SAMEORIGIN" always;

    # CSP: unsafe-inline is required by NiFi, Grafana, and Jaeger UIs.
    # This is a known exception documented here; it cannot be tightened at
    # the proxy layer without application-level nonce support.
    # Review each upstream application's CSP recommendations when upgrading.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'self'"
        always;

    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Restrict browser feature access. serial=() and usb=() are explicit
    # because this gateway proxies industrial (OT) tooling.
    add_header Permissions-Policy
        "geolocation=(), microphone=(), camera=(), usb=(), serial=()" always;

    # -------------------------------------------------------------------------
    # TLS HARDENING
    # TLS 1.3 only. All TLS 1.2 directives (ssl_ciphers, ssl_dhparam,
    # ssl_ecdh_curve, ssl_session_cache, ssl_session_tickets) are omitted
    # because they have no effect on TLS 1.3 and would only apply if TLS 1.2
    # were re-enabled.
    #
    # TLS 1.3 session resumption uses PSK (Pre-Shared Key) tickets managed
    # automatically by OpenSSL; no manual session cache configuration is
    # needed or useful.
    #
    # OCSP Stapling is disabled: this gateway uses a private CA. OCSP
    # stapling only applies to publicly trusted certificates.
    # -------------------------------------------------------------------------
    ssl_protocols TLSv1.3;
    ssl_session_timeout 1d;
    ssl_stapling        off;
    ssl_stapling_verify off;

    # -------------------------------------------------------------------------
    # UPSTREAM PROXY TLS
    # proxy_ssl_* directives are set at server{} scope in default.conf, not
    # here at http{} scope. This is required because all upstreams use
    # variable-based proxy_pass (set $var / proxy_pass https://$var) for
    # deferred DNS resolution — nginx must not fail to start when a backend
    # is unavailable. nginx only inherits proxy_ssl_certificate into
    # variable upstreams reliably when the directive is set at server{} or
    # location{} scope.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # DOCKER INTERNAL DNS
    # 127.0.0.11 is Docker's embedded DNS resolver. Required for all
    # variable-based upstreams (set $var / proxy_pass https://$var).
    # It is only reachable via IPv4 regardless of the network stack.
    # valid=30s prevents stale entries from persisting across service restarts.
    # -------------------------------------------------------------------------
    resolver         127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # LOGGING
    # Buffered writes with a short flush interval (5 s) balance throughput
    # against the audit-trail loss window (ISO 27002 A.8.15).
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log otel_custom buffer=256k flush=5s;

    # -------------------------------------------------------------------------
    # PERFORMANCE
    # keepalive_timeout is set high (600 s) to support long-lived WebSocket
    # connections used by NiFi and Grafana Live.
    # -------------------------------------------------------------------------
    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     600;
    types_hash_max_size   2048;
    client_body_buffer_size 128k;

    # 64 MiB accommodates NiFi flow uploads and large FlowFile transfers.
    client_max_body_size  64m;

    # -------------------------------------------------------------------------
    # REAL-IP MAPPING
    # Extracts the originating client IP from X-Forwarded-For when set,
    # falling back to the direct connection address. Used in rate-limiting
    # zones and access logs.
    #
    # NOTE: X-Forwarded-For trust is acceptable here because this nginx
    # instance is the outermost ingress point (net-edge); no untrusted proxy
    # sits upstream. If a CDN or external load balancer is added in front,
    # restrict trusted proxies with set_real_ip_from + real_ip_header.
    # -------------------------------------------------------------------------
    map $http_x_forwarded_for $real_ip {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # SERVER CONFIGURATIONS
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
