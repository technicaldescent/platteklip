    metric_name: edge.plc.input.status
    brief: "PLC digital input status bitmask."
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.vehicle.plc.id

  - id: metric.edge.plc.output.status
