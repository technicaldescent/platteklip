# =================================================================
# Project Configuration with Normative References
# =================================================================

# Controls:

# NIST 800-53 Rev 5:
# - SA-15: Development Process, Standards, and Tools
# - SA-11: Developer Security Testing
# - CM-3: Configuration Change Control
# - CM-7: Least Functionality
# - SI-7: Software Integrity
# - RA-5: Vulnerability Scanning
# - SI-10: Information Input Validation
# - SA-8: Security and Privacy Engineering Principles
# - SI-4: System Monitoring

# ISO/IEC 27002:2022:
# - 5.15-5.18: Access Control & Access Rights
# - 5.32: Intellectual Property Rights
# - 8.8: Management of Technical Vulnerabilities
# - 8.9: Configuration Management
# - 8.12: Data Leakage Prevention
# - 8.24: Use of Cryptography
# - 8.25: Secure Development Life Cycle
# - 8.27: Secure System Architecture and Engineering
# - 8.28: Secure Coding
# - 8.29: Security Testing in Development and Acceptance
# - 8.32: Change Management
# - 8.33: Test Information

# Change Control:
# git >= 2.52.0 (https://git-scm.com/)
# Conventional Commits 1.0.0 (https://www.conventionalcommits.org/en/v1.0.0/)
# Semantic Versioning 2.0.0 (https://semver.org/)

# Software Bill of Materials:
# SPDX Specification 3.1 (https://spdx.github.io/spdx-spec/v3.1-dev/)
# Open Source Initiative Approved Licenses (https://opensource.org/licenses)
# Scientific Python Ecosystem Coordination:
# SPEC 0 (https://scientific-python.org/specs/spec-0000/)
# * Python MINOR versions are dropped after 24 months.
# * MINOR versions of SPEC Core Projects are dropped after 12 months, including:
#   IPython, Matplotlib, NetworkX, NumPy, pandas, PySAL,
#   Scikit-HEP, scikit-image, scikit-learn, SciPy, xarray, Zarr-Python

# Data Bill of Materials:
# Data Version Control (DVC)
# MLCommons Croissant 1.1 (https://docs.mlcommons.org/croissant)

# =================================================================
# Build Automation
# =================================================================

[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "pip>=26.0.0"
]
build-backend = "hatchling.build"

# =================================================================
# Project Metadata
# =================================================================

[project]
name = "platteklip"
dynamic = ["version"]
description = "Zero-Trust Telemetry Gateway and Observability Plane"
requires-python = ">=3.14"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    {name = "technical descent"},
]
maintainers = [
    {name = "Raymond Ellis", email = "raymond.ellis@gmail.com"},
]

keywords = [
    "data-engineering",
    "devsecops",
    "open-telemetry",
    "scada",
]

classifiers = [
    "Private :: Do Not Upload",

    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Natural Language :: English",

    "Operating System :: POSIX",

    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Topic :: Scientific/Engineering",

    "Typing :: Typed",
]

# Core dependencies
dependencies = [
]

[project.optional-dependencies]

dev = [
    "bandit>=1.9.0",
    "behave>=1.3.0",
    "black>=26.1.0",
    "codecarbon>=3.2.0",
    "codespell>=2.4.0",
    "coverage>=7.13.0",
    "detect-secrets>=1.5.0",
    "flake8>=7.3.0",
    "hypothesis>=6.151.0",
    "interrogate>=1.7.0",
    "mlcroissant>=1.0.0",
    "mypy>=1.19.0",
    "opa-python-client>=2.0.0",
    "pipdeptree>=2.31.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.0",
    "pylint>=4.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-opentelemetry>=1.1.0",
    "pyyaml>=6.0.0",
    "reuse>=6.2.0",
    "safety>=3.7.0",
    "python-semantic-release>=10.5.0",
    "sigstore>=4.2.0",
    "tryceratops>=2.4.0",
    "xenon>=0.9.3",
]

docs = [
    "pyyaml>=6.0.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.5.0",
    "sphinxcontrib-bibtex>=2.6.0",
    "sphinx-jsonschema>=1.19.0",
    "myst-parser>=5.0.0",
]

observability = [
    "opentelemetry-sdk==1.39.0",
    "opentelemetry-distro==0.59b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.0",
    "opentelemetry-exporter-prometheus==0.59b0",
    "opentelemetry-exporter-richconsole==0.59b0",
    "opentelemetry-instrumentation==0.59b0",
    "opentelemetry-instrumentation-logging==0.59b0",
]

sbom = [
    "model-signing>=1.1.0",
]

torch = [
    "accelerate>=1.12.0",
    "onnx>=1.20.0",
    "safetensors>=0.7.0",
    "torch>=2.10.0",
    "torchmetrics>=1.8.0",
]

[project.urls]
homepage = "https://github.com/technicaldescent/platteklip"
documentation = "https://github.com/technicaldescent/platteklip/README.md"
source = "https://github.com/technicaldescent/platteklip"
issues = "https://github.com/technicaldescent/platteklip/issues"
changelog = "https://github.com/technicaldescent/platteklip/blob/main/CHANGELOG.md"
security = "https://github.com/technicaldescent/platteklip/blob/main/SECURITY.md"
contributing = "https://github.com/technicaldescent/platteklip/blob/main/CONTRIBUTING.md"
discussion = "https://github.com/technicaldescent/platteklip/discussions"


# =================================================================
# Build Configuration
# =================================================================

[tool.hatch.version]
fallback-version = "0.0.0"
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build]
include = [
    "src/platteklip",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platteklip"]
# Ensures the wheel contains the audit trail for NIST SA-15
sign = true
sbom = true
sbom-format = "spdx"
# Force reproducible builds for binary hashing (SI-7)
reproducible = true

[tool.hatch.build.targets.wheel.requires]
verify_hash = true

# =================================================================
# Audit Configuration
# =================================================================

[tool.hatch.envs.audit]
detached = false
dependencies = [
    ".dev",
    ".observability",
]

# Defaults to localhost, but allows override via export OTEL_ENDPOINT=...
[tool.hatch.envs.audit.env-vars]
OTEL_EXPORTER_OTLP_ENDPOINT = "{env:OTEL_ENDPOINT:http://localhost:4317}"
OTEL_SERVICE_NAME = "platteklip-audit"
PYTHONPATH = "src"

[[tool.hatch.envs.audit.matrix]]
mode = ["safety", "stress"]

[tool.hatch.envs.audit.scripts]
run = [
  { value = "pytest -m health", if = ["mode=safety"] },
  { value = "pytest -m performance --durations=10", if = ["mode=stress"] },
]

[tool.hatch.envs.hatch-static-analysis]
installer = "pip"

[tool.hatch.envs.quality]
dependencies = [
    ".dev",
]

[tool.hatch.envs.quality.scripts]
check = [
    "bandit -c pyproject.toml -r src",
    "black --check --diff src tests",
    "detect-secrets scan",
    "flake8 src tests",
    "interrogate -vv .",
    "mlcroissant validate --jsonld ./data/croissant.json",
    "pip-audit",
    "tryceratops --config pyproject.toml check src tests",
    "xenon --max-absolute A --max-modules A --max-average A src",
]

[tool.hatch.envs.docs]
dependencies = [".docs"]

# =================================================================
# Release Management & Security
# =================================================================

[tool.semantic_release]
version_variable = ["src/platteklip/__init__.py:__version__"]
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true
upload_to_pypi = false
upload_to_release = true
commit_message = "ci(release): {version}"
tag_commit_message = "ci: release {version}"
no_git_verify = false
tag_format = "v{version}"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",                # Changes that affect the build system
    "ci",                   # CI configuration changes
    "docs",                 # Documentation only changes
    "feat",                 # New features (minor version)
    "fix",                  # Bug fixes (patch version)
    "perf",                 # Performance improvements (patch version)
    "refactor",             # Code refactoring
    "revert",               # Revert previous commits
    "style",                # Code style changes
    "test",                 # Adding/modifying tests
]
major_tags = ["BREAKING", "BREAKING CHANGE"]  # Triggers major version bump
minor_tags = ["feat"]                         # Triggers minor version bump
patch_tags = ["fix", "perf"]                  # Triggers patch version bump

default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "update"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.changelog.environment]
block_start_string = "{%%"
block_end_string = "%%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = false

[tool.semantic_release.branches.main]
match = "main"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "alpha"      # Results in x.y.z-alpha.n

[tool.semantic_release.branches.alpha]
# Match branches with the prefixes 'feat/', 'fix/', or 'perf/'.
match = "^(feat|fix|perf)/.+"
prerelease = true
prerelease_token = "alpha"      # Results in x.y.z-alpha.n

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"       # Results in x.y.z-beta.n

[tool.semantic_release.branches.release]
match = "release/.*"
prerelease = true
prerelease_token = "rc"         # Results in x.y.z-rc.n
bump_patch_without_tag = false

[tool.sigstore]
enabled = true
identity = "https://github.com/technicaldescent/platteklip"
rekor_url = "https://rekor.sigstore.dev"
fulcio_url = "https://fulcio.sigstore.dev"

# =================================================================
# Linting and Security
# =================================================================

[tool.bandit]
exclude_dirs = []
targets = ["src"]
aggregate = "file"
confidence-level = "MEDIUM"
severity-level = "LOW"

[tool.black]
preview = true

[tool.codespell]
check-filenames = true
check-hidden = false
skip = [
    "**/*.bib",
    "*/build",
    "./.codespell/*",
    "./coverage.xml",
    "./dist",
    "**/gherkin-languages.json",
    "**/i18n",
    "LICENSE",
    "./LICENSES",
    "**/grafana/dashboards",
    "**/weaver/semantic-conventions",
]
dictionary = [
    ".codespell/dictionary_en.txt",
    ".codespell/dictionary_engineering.txt",
    ".codespell/dictionary_style.txt",
    ".codespell/dictionary_units.txt",
    "-"
]
ignore-words = ".codespell/codespellignore"

[tool.detect-secrets]
exclude-lines = [
    "EXAMPLE=",
    "SAMPLE_",
]

[tool.flake8]
min-python-version = 3.14
# Compatible with Black.
max-line-length = 88

# Cyclomatic complexity threshold.
# NASA Software Assurance and Software Safety maximum is 15.
# Basis Path Coverage would require no fewer than 15 tests.
max-complexity = 10

# Rules that conflict with Black.
# E203: whitespace before ':'
# W503: line break before binary operator
ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.mypy]
mypy_path = ["src"]
files = ["src", "tests"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
namespace_packages = true
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
# Silence "Untyped decorator" errors specifically for behave steps
module = "features.*"
disallow_untyped_decorators = false

[tool.pip-audit]
format = "json"
desc = true

[tool.pylint.main]
fail-under = 9.95
load-plugins = []
max-line-length = 88

[tool.safety]
continue-on-error = false

[tool.tryceratops]
exclude = [
    "tests/*",
    "src/platteklip/vendored/*",
    "docs/*",
    "scripts/*",
    "benchmarks/*",
]
fix = true
ignore = [
    "TRY002",
    "TRY003",
    "TRY201",
    "TRY400",
]
include_exit_codes = true
verbose = true

[tool.xenon]
max-absolute = "A"
max-modules = "A"
max-average = "A"
exclude = [
    "src/platteklip/vendored/*",
]

# =================================================================
# Testing
# =================================================================

[tool.behave]
paths = ["features/srs", "features/syrs"]
show_skipped = false
summary = true
stderr_capture = true
stdout_capture = true

[tool.coverage.run]
branch = true
parallel = true
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.interrogate]
exclude = ["build", "docs"]
fail-under = 100
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-module = false
ignore-nested-classes = false
ignore-nested-functions = false
ignore-overloaded-functions = false
ignore-private = false
ignore-property-decorators = false
ignore-semiprivate = false
ignore-setters = false
omit-covered-files = false
quiet = false
style = "sphinx"
verbose = 2

[tool.pytest.ini_options]
addopts = """
    -ra -q
    --cov=platteklip
    --cov-report=xml
    --junitxml=test-results.xml
    --cov-branch
    --cucumberjson=cucumber.json
    -m "not performance"
"""
filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
    "error::ImportWarning",
    "error::PendingDeprecationWarning",
    "error::ResourceWarning",

    "ignore:'maxsplit' is passed as positional argument:DeprecationWarning",
]
log_level = "INFO"
markers = [
    "acceptance: test-level to determine whether to accept the system",
    "adverserial: creation and execution of adversarial examples",
    "health: health tests for running processes",
    "integration: interaction-level tests between components or systems",
    "performance: performance and benchmark tests",
    "regression: tests for fixed bugs and refactoring",
    "unit: unit-level tests for individual components",
]
minversion = "9.0.0"
python_files = ["test_*.py"]
python_functions = "test_*"
pythonpath = "src"
testpaths = [
    "tests",
    "features"
]
xfail_strict = true
