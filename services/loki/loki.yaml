# This is a configuration to deploy Loki backed by the filesystem.
# The index will be shipped to the storage via tsdb-shipper.

---
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: ./loki

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

distributor:
  ring:
    kvstore:
      store: "inmemory"

querier:
  max_concurrent: 10

ingester:
  lifecycler:
    ring:
      kvstore:
        store: "inmemory"

storage_config:
  filesystem:
    directory: ./loki/chunks

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
