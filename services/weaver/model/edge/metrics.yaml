    metric_name: edge.plc.operational.status
    brief: "PLC operational status composed from multiple boolean flags."
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.vehicle.plc.id
