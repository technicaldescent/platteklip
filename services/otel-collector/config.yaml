# OpenTelemetry Collector (contrib) base configuration.
#
# Standards applied:
#   - OTel Specification 1.45.0
#   - OTel Semantic Conventions 1.34
#   - ISO/IEC 27002:2022 A.8.15 (Logging), A.8.20 (Network Security)
#
# The transform/weaver processor is defined in a separate
# Weaver-generated config fragment that the Collector
# merges at startup via the second --config flag.
# To regenerate, run:
#   docker compose run --rm weaver

---
# =============================================================================
# RECEIVERS
# =============================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "[::]:4317"
        max_recv_msg_size_mib: 4
        tls:
          cert_file: /run/secrets/tls_certificate.crt
          key_file:  /run/secrets/tls_private_key.key
          client_ca_file: /run/secrets/ca.crt

  # Self-scrape the collector's internal telemetry endpoint.
  # Port 8888 is bound to localhost (plain HTTP, never exposed
  # on the network).  The scraped otelcol_* metrics are routed
  # through a separate metrics/internal pipeline to a dedicated
  # mTLS-secured Prometheus exporter on port 8890.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector-internal
          scrape_interval: 10s
          static_configs:
            - targets: ["127.0.0.1:8888"]

# =============================================================================
# PROCESSORS
# Ordered by pipeline position. memory_limiter MUST be first in every
# pipeline to shed load before any buffering or batching occurs.
#
# NOTE: The transform/weaver processor is not defined here.
# It is generated by Weaver and merged via a second --config
# flag at startup.  See compose.yaml otel-collector service.
# =============================================================================
processors:

  # ---------------------------------------------------------------------------
  # Memory pressure protection.
  # Container memory limit in compose.yaml is 512 MiB.
  # limit_percentage at 75% = 384 MiB hard ceiling.
  # spike_limit_percentage at 15% = 76 MiB headroom above the limit.
  # ---------------------------------------------------------------------------
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  # ---------------------------------------------------------------------------
  # Environment label — applied to logs only, where resource context is most
  # useful for log routing in Loki. Traces carry this via the SDK resource.
  # ---------------------------------------------------------------------------
  resource:
    attributes:
      - key: service.environment
        value: "development"
        action: upsert

  # ---------------------------------------------------------------------------
  # Security sanitisation (ISO/IEC 27002:2022 A.8.11, GDPR Art. 25).
  # Deletes credential and token attributes before export.
  # Hashes PII (user.email) rather than deleting, to preserve cardinality
  # for debugging while preventing plaintext PII export.
  # ---------------------------------------------------------------------------
  attributes/sanitize:
    actions:
      - key: password
        action: delete
      - key: api_key
        action: delete
      - key: authorization
        action: delete
      - key: token
        action: delete
      - key: user.email
        action: hash

  # ---------------------------------------------------------------------------
  # Drop internal health check spans to reduce noise and storage cost.
  # Uses exclude so all non-health spans are kept.
  # ---------------------------------------------------------------------------
  filter/drop_health_checks:
    error_mode: ignore
    spans:
      exclude:
        match_type: strict
        attributes:
          - key: http.target
            value: ["/health", "/ready", "/alive", "/healthz"]

  # ---------------------------------------------------------------------------
  # Batching — tuned per signal type.
  # Traces: small batches, short timeout for low tail latency.
  # Metrics: large batches, longer timeout to amortise Prometheus scrape cost.
  # Logs: medium batches, medium timeout.
  # ---------------------------------------------------------------------------
  batch/traces:
    send_batch_size:     512
    send_batch_max_size: 1024
    timeout: 5s

  batch/metrics:
    send_batch_size:     8192
    send_batch_max_size: 16384
    timeout: 10s

  batch/logs:
    send_batch_size:     1024
    send_batch_max_size: 2048
    timeout: 5s

# =============================================================================
# EXPORTERS
# =============================================================================
exporters:

  # ---------------------------------------------------------------------------
  # Traces → Jaeger via OTLP/gRPC + mTLS.
  # ---------------------------------------------------------------------------
  otlp_grpc/jaeger:
    endpoint: "jaeger:4317"
    tls:
      ca_file:   /run/secrets/ca.crt
      cert_file: /run/secrets/tls_certificate.crt
      key_file:  /run/secrets/tls_private_key.key
      insecure:             false
      insecure_skip_verify: false
      min_version: "1.3"
    retry_on_failure:
      enabled:          true
      initial_interval: 5s
      max_interval:     30s
      max_elapsed_time: 300s
    sending_queue:
      enabled:       true
      num_consumers: 4
      queue_size:    100

  # ---------------------------------------------------------------------------
  # Metrics → Prometheus scrape endpoint (pull model, mTLS).
  # Exposes pipeline metrics (platteklip_* namespace) on port 8889.
  # ---------------------------------------------------------------------------
  prometheus:
    endpoint: "[::]:8889"
    namespace: platteklip
    send_timestamps: true
    metric_expiration: 5m
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
    tls:
      cert_file:      /run/secrets/tls_certificate.crt
      key_file:       /run/secrets/tls_private_key.key
      client_ca_file: /run/secrets/ca.crt

  # ---------------------------------------------------------------------------
  # Logs → Loki via OTLP/HTTP + mTLS.
  # The otlphttp exporter appends /v1/logs to the endpoint automatically,
  # so the base path must include /otlp to produce the correct URL:
  #   https://loki:3100/otlp/v1/logs
  # ---------------------------------------------------------------------------
  otlphttp/loki:
    endpoint: https://loki:3100/otlp
    tls:
      ca_file:   /run/secrets/ca.crt
      cert_file: /run/secrets/tls_certificate.crt
      key_file:  /run/secrets/tls_private_key.key
      insecure:             false
      insecure_skip_verify: false
      min_version: "1.3"
    retry_on_failure:
      enabled:          true
      initial_interval: 5s
      max_interval:     30s
      max_elapsed_time: 300s
    sending_queue:
      enabled:       true
      num_consumers: 4
      queue_size:    100

  # ---------------------------------------------------------------------------
  # All signals → Kafka (per-signal topics, mTLS).
  #
  # Since collector-contrib v0.124.0 the top-level topic and encoding
  # fields are removed.  Each must be nested under the signal key
  # matching the pipeline that uses the exporter.
  # ---------------------------------------------------------------------------
  kafka/traces:
    brokers: ["kafka:9093"]
    protocol_version: "3.6.0"
    traces:
      topic: "otel.traces"
      encoding: otlp_proto
    auth:
      tls:
        ca_file:              /run/secrets/ca.crt
        cert_file:            /run/secrets/tls_certificate.crt
        key_file:             /run/secrets/tls_private_key.key
        insecure_skip_verify: false
    retry_on_failure:
      enabled:          true
      initial_interval: 5s
      max_interval:     30s
      max_elapsed_time: 300s
    sending_queue:
      enabled:       true
      num_consumers: 4
      queue_size:    100

  kafka/metrics:
    brokers: ["kafka:9093"]
    protocol_version: "3.6.0"
    metrics:
      topic: "otel.metrics"
      encoding: otlp_proto
    auth:
      tls:
        ca_file:              /run/secrets/ca.crt
        cert_file:            /run/secrets/tls_certificate.crt
        key_file:             /run/secrets/tls_private_key.key
        insecure_skip_verify: false
    retry_on_failure:
      enabled:          true
      initial_interval: 5s
      max_interval:     30s
      max_elapsed_time: 300s
    sending_queue:
      enabled:       true
      num_consumers: 4
      queue_size:    100

  kafka/logs:
    brokers: ["kafka:9093"]
    protocol_version: "3.6.0"
    logs:
      topic: "otel.logs"
      encoding: otlp_proto
    auth:
      tls:
        ca_file:              /run/secrets/ca.crt
        cert_file:            /run/secrets/tls_certificate.crt
        key_file:             /run/secrets/tls_private_key.key
        insecure_skip_verify: false
    retry_on_failure:
      enabled:          true
      initial_interval: 5s
      max_interval:     30s
      max_elapsed_time: 300s
    sending_queue:
      enabled:       true
      num_consumers: 4
      queue_size:    100

  # ---------------------------------------------------------------------------
  # Collector internal metrics → Prometheus scrape endpoint (port 8890).
  # Secured: HTTPS + mTLS.  No namespace prefix so that otelcol_* metric
  # names are preserved for standard dashboard queries.
  # Receives metrics from the prometheus/self receiver via the
  # metrics/internal pipeline.
  # ---------------------------------------------------------------------------
  prometheus/internal:
    endpoint: "[::]:8890"
    send_timestamps: true
    metric_expiration: 5m
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
    tls:
      cert_file:      /run/secrets/tls_certificate.crt
      key_file:       /run/secrets/tls_private_key.key
      client_ca_file: /run/secrets/ca.crt

# =============================================================================
# EXTENSIONS
# =============================================================================
extensions:
  health_check:
    endpoint: "[::]:13133"

# =============================================================================
# SERVICE
# =============================================================================
service:
  extensions: [health_check]

  telemetry:
    resource:
      service.instance.id: "otel-collector"
    logs:
      level: warn
      encoding: json
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: "127.0.0.1"
                port: 8888

  pipelines:

    traces:
      receivers:  [otlp]
      processors:
        - memory_limiter
        - filter/drop_health_checks
        - attributes/sanitize
        - batch/traces
      exporters:  [otlp_grpc/jaeger, kafka/traces]

    metrics:
      receivers:  [otlp]
      processors:
        - memory_limiter
        - transform/weaver
        - attributes/sanitize
        - batch/metrics
      exporters:  [prometheus, kafka/metrics]

    logs:
      receivers:  [otlp]
      processors:
        - memory_limiter
        - resource
        - attributes/sanitize
        - batch/logs
      exporters:  [otlphttp/loki, kafka/logs]

    # Collector internal telemetry.  The prometheus/self receiver
    # scrapes the localhost-only port 8888 and routes the otelcol_*
    # metrics through this dedicated pipeline to the mTLS-secured
    # prometheus/internal exporter on port 8890.
    metrics/internal:
      receivers:  [prometheus/self]
      processors:
        - memory_limiter
        - batch/metrics
      exporters:  [prometheus/internal]
