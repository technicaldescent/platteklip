# Security Standards and Benchmarks Applied:
# - CIS Docker Benchmark v1.7:
#     - Controls: 1.1.2, 4.1, 5.2, 5.3, 5.10, 5.12, 5.25, 5.26, 5.29
# - NIST SP 800-190: Container Security Guidelines
# - ISO/IEC 27001:2022:
#     - A.8.32 (Access Control), A.12.3 (Backup), A.13 (Network Security)
# - OWASP Container Security Verification Standard (CSVS)

# ###########################################################################
# DEFAULT SECURITY AND RESOURCE CONFIGURATION
# ###########################################################################

---
x-default-config: &default-config
  cap_drop:                     # CIS 5.2: Drop unnecessary capabilities
    - ALL
    - NET_RAW
    - SYS_ADMIN
    - SYS_MODULE
  deploy:
    resources:
      limits:
        memory: 64M             # Enforce memory limits (CIS Docker 5.2 and 5.3)
        cpus: 1
        pids: 100               # Set -1 for unlimited PIDs (not recommended)
  env_file: .env
  environment:
    - DOCKER_CONTENT_TRUST=1    # Ensure image content is trusted
    - AUDIT_LOG_LEVEL=DEBUG     # Enable audit logging
  privileged: false
  pull_policy: missing
  read_only: true               # CIS 5.12: Filesystem immutability
  restart: on-failure:5
  security_opt:
    - no-new-privileges=true    # CIS 5.26: Prevent privilege escalation
    - apparmor=docker-default   # CIS 5.1: AppArmor default profile
  stop_grace_period: 15s
  tmpfs: &default-tmpfs
    - /tmp:size=256M,uid=1000,gid=1000,noexec
    - /run
  user: 1000:1000       # NIST SP 800-190: Least privilege (CIS Docker 1.1.2)

x-healthcheck: &default-healthcheck
  interval: 90s
  timeout: 10s
  retries: 3
  start_period: 30s
  start_interval: 5s

x-otel-logging: &otel-logging
  driver: "otlp"
  options:
    otlp-endpoint: "grpc://otel-collector:4317"  # gRPC endpoint
    otlp-insecure: "true"                        # DEVELOPMENT ONLY
    otlp-resource-attributes: >-
      service.name={{.Name}},
      container.id={{.ID}},
      container.name={{.Name}},
      container.image.name={{.ImageName}}

services:
  # ###########################################################################
  # NGINX REVERSE PROXY
  # ###########################################################################
  nginx:
    <<: *default-config
    container_name: nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/health"]
      <<: *default-healthcheck
    image: nginx:stable-alpine3.20-perl
    networks:
      - back-tier
      - front-tier
    ports:
      - "443:443"       # Expose HTTPS externally
    profiles:
      - experimental
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx:rw,uid=101,gid=101
      - /var/tmp/nginx:rw,uid=101,gid=101
    user: "101:101"
    volumes:
      - ${PROJECT_ROOT}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PROJECT_ROOT}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${PROJECT_ROOT}/nginx/certs:/etc/nginx/certs:ro

  # ###########################################################################
  # NETWORK TIME PROTOCOL (NTP)
  # ###########################################################################
  chrony:
    <<: *default-config
    cap_add:
      - SYS_TIME
    container_name: network-time-protocol
    environment:
      - CHRONY_DRIFT_FILE=/var/lib/chrony/chrony.drift
      - ENABLE_NTS=true
    image: cturra/ntp:latest
    networks:
      - telemetry
    profiles:
      - experimental
    tmpfs:
      - /run/chrony:rw,mode=1750
    volumes:
      - chrony-data:/var/lib/chrony
      - ${PROJECT_ROOT}/chrony/chrony.conf:/etc/chrony.conf:ro

  # ###########################################################################
  # IDENTITY AND ACCESS MANAGEMENT (IAM)
  # ###########################################################################
  keycloak-postgres:
    <<: *default-config
    container_name: keycloak-postgres
    environment:
      ALLOW_EMPTY_PASSWORD: false
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: mlops      # pragma: allowlist secret
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      <<: *default-healthcheck
    image: postgres:18.0-alpine3.22
    networks:
      - back-tier
    profiles:
      - experimental
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0755
    volumes:
      - keycloak-data:/var/lib/postgresql/data

  keycloak:
    <<: *default-config
    command: ["start"]
    container_name: keycloak
    depends_on:
      keycloak-postgres:
        condition: service_healthy
        required: true
    environment:
      KC_HTTP_ENABLED: true
      KEYCLOAK_ENABLE_HTTPS: false
      KEYCLOAK_HTTPS_CERTIFICATE_FILE:
      KEYCLOAK_HTTPS_CERTIFICATE_KEY_FILE:
      KC_DB: postgres
      DB_ADDR: keycloak-postgres
      DB_DATABASE: keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: mlops               # pragma: allowlist secret
      KC_DB_SCHEMA: public
      KEYCLOAK_CREATE_ADMIN_USER: true
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_PASSWORD: mlops  # pragma: allowlist secret
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_PRODUCTION: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      <<: *default-healthcheck
    image: keycloak/keycloak:26.4.0
    networks:
      - back-tier
      - front-tier
    ports:
      - "${KEYCLOAK_HTTP_PORT}:${KEYCLOAK_HTTP_PORT}"
      - "${KEYCLOAK_HTTPS_PORT}:${KEYCLOAK_HTTPS_PORT}"
    profiles:
      - experimental

  # ###########################################################################
  # OPENTELEMETRY WEAVER
  # ###########################################################################
  otel-weaver:
    <<: *default-config
    container_name: otel-weaver
    environment:
      - WEAVER_CONFIG_PATH=/etc/weaver/config.yaml
      - WEAVER_OUTPUT_DIR=/generated
      - WEAVER_TEMPLATES_DIR=/templates
    healthcheck:
      test: ["CMD", "weaver", "validate", "--config", "/etc/weaver/config.yaml"]
      <<: *default-healthcheck
    image: otel/weaver:main
    networks:
      - telemetry
    profiles:
      - experimental
    volumes:
      - ${PROJECT_ROOT}/weaver/semantic-conventions:/etc/weaver:ro
      - ${PROJECT_ROOT}/weaver/generated-code:/generated
      - ${PROJECT_ROOT}/weaver/weaver-templates:/templates

  # ###########################################################################
  # MESSAGE QUEUING TELEMETRY TRANSPORT (MQTT) BROKER
  # ###########################################################################
  mqtt-broker:
    <<: *default-config
    container_name: mqtt-broker
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 512M
          pids: 512
        reservations:
          cpus: '0.25'
          memory: 128M
    image: eclipse-mosquitto:openssl
    networks:
      - telemetry
    ports:
      - "${MQTT_PORT}:${MQTT_PORT}"             # UNENCRYPTED
      - "${MQTT_TLS_PORT}:${MQTT_TLS_PORT}"
    profiles:
      - core
    volumes:
      - ${PROJECT_ROOT}/mosquitto/data:/mosquitto/data:rw
      - ${PROJECT_ROOT}/mosquitto/log:/mosquitto/log:rw
      - ${PROJECT_ROOT}/mosquitto/config:/mosquitto/config:ro
    restart: unless-stopped

  # ###########################################################################
  # APACHE KAFKA
  # ###########################################################################
  kafka:
    <<: *default-config
    container_name: kafka
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: >-
        PLAINTEXT://kafka:${KAFKA_BROKER_PORT},
        CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:${KAFKA_BROKER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'ciWo7307S5y4yF_bYaB0_A=='
    image: apache/kafka:4.1.0-rc1
    networks:
      - telemetry
    ports:
      - "${KAFKA_BROKER_PORT}:${KAFKA_BROKER_PORT}"
    profiles:
      - core
    read_only: false
    tmpfs:
      - /tmp:size=256M,uid=1000,gid=1000,mode=1777
    volumes:
      - kafka-data:/var/lib/kafka/data

  # DASHBOARD (DEVELOPMENT ONLY)
  kafdrop:
    <<: *default-config
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 16M
    networks:
      - telemetry
      - front-tier
    ports:
      - "9005:9000"
    profiles:
      - core
    environment:
      - KAFKA_BROKERCONNECT=kafka:${KAFKA_BROKER_PORT}

  # ###########################################################################
  # OPENTELEMETRY COLLECTOR
  # ###########################################################################
  otel-collector:
    <<: *default-config
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0440
    container_name: otel-collector
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
          pids: 1024
        reservations:
          cpus: '0.50'
          memory: 256M
    environment:
      - JAEGER_ENDPOINT=jaeger:${OTLP_GRPC_PORT}
      - KAFKA_BROKER=kafka:${KAFKA_BROKER_PORT}
      - PROMETHEUS_ENDPOINT=0.0.0.0:${OTEL_COLLECTOR_METRICS_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://localhost:13133/"]
      <<: *default-healthcheck
    image: otel/opentelemetry-collector-contrib:latest
    labels:
      com.opentelemetry.service: "collector"
      com.opentelemetry.environment: "development"
      com.opentelemetry.version: "1.49.0"
      io.spdx.license: "Apache-2.0"
      io.spdx.copyright: "2025 system-under-test contributors"
    networks:
      - telemetry
    ports:
      - "${OTLP_GRPC_PORT}:${OTLP_GRPC_PORT}"
      - "${OTLP_HTTP_PORT}:${OTLP_HTTP_PORT}"
      - "${OTEL_COLLECTOR_METRICS_PORT}:${OTEL_COLLECTOR_METRICS_PORT}"
      - "${OTEL_COLLECTOR_HEALTHCHECK_PORT}:${OTEL_COLLECTOR_HEALTHCHECK_PORT}"
    profiles:
      - core
    read_only: false
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /var/cache:mode=0755,size=64m
    volumes:
      - ${PROJECT_ROOT}/weaver/semantic-conventions:/etc/otelcol-contrib/semantic-conventions:ro
      - otel-storage:/var/lib/otelcol:rw

  # ###########################################################################
  # GRAFANA ALLOY OPENTELEMETRY COLLECTOR DISTRIBUTION
  # ###########################################################################
  alloy:
    <<: *default-config
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:${ALLOY_PORT}
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ALLOY_PORT}/health"]
      <<: *default-healthcheck
    image: grafana/alloy:latest
    networks:
      - telemetry
      - front-tier
    ports:
      - "${ALLOY_PORT}:${ALLOY_PORT}"
    profiles:
      - experimental
    volumes:
      - ./data/processed:/processed
      - ${PROJECT_ROOT}/alloy:/etc/alloy:ro
      - ${PROJECT_ROOT}/alloy-positions:/var/lib/alloy

  # ###########################################################################
  # PROMETHEUS
  # ###########################################################################
  prometheus:
    <<: *default-config
    configs:
      - source: prometheus_config
        target: /etc/prometheus/config.yaml
        mode: 0440
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/config.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=1d'
      - '--storage.tsdb.retention.size=256MB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.listen-address=:${PROMETHEUS_PORT}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PROMETHEUS_PORT}/-/ready"]
      <<: *default-healthcheck
    image: prom/prometheus:v3.6.0-rc.1
    networks:
      - telemetry
      - front-tier
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    profiles:
      - core
    tmpfs:
      - /prometheus/wal:size=256M,uid=65534
    user: "65534:65534"
    volumes:
      - prometheus-data:/prometheus:rw

  # ###########################################################################
  # GRAFANA
  # ###########################################################################
  grafana:
    <<: *default-config
    container_name: grafana
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: mlops    # pragma: allowlist secret
      GF_DASHBOARDS_DEFAULT_HOME: /etc/grafana/dashboards/
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GRAFANA_PORT}/api/health"]
      <<: *default-healthcheck
    image: grafana/grafana:main
    networks:
      - telemetry
      - front-tier
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    profiles:
      - development
    user: "472:472"
    volumes:
      - grafana-storage:/var/lib/grafana:rw
      - ${PROJECT_ROOT}/grafana/dashboards:/var/lib/grafana/dashboards:rw
      - ${PROJECT_ROOT}/grafana/provisioning:/etc/grafana/provisioning:ro

  # ###########################################################################
  # LOKI LOG AGGREGATOR
  # ###########################################################################
  loki:
    <<: *default-config
    configs:
      - source: loki_config
        target: /etc/loki/config.yaml
        mode: 0440
    container_name: loki
    command:
      - -config.file=/etc/loki/config.yaml
      - -config.expand-env=true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f",
             "http://localhost:${LOKI_PORT}/loki/api/v1/metrics"]
      <<: *default-healthcheck
    image: grafana/loki:main-db5e021
    networks:
      - telemetry
    ports:
      - "${LOKI_PORT}:${LOKI_PORT}"
      - "${LOKI_GRPC_PORT}:${LOKI_GRPC_PORT}"
    profiles:
      - core
    read_only: false
    user: "10001:10001"
    volumes:
      - loki-data:/loki:rw

  # ###########################################################################
  # JAEGER TRACING
  # ###########################################################################
  jaeger:
    <<: *default-config
    configs:
      - source: jaeger_config
        target: /etc/jaeger/config.yaml
        mode: 0440
    container_name: jaeger
    environment:
      - JAEGER_AGENT_COMPACT_PORT=${JAEGER_AGENT_COMPACT_PORT}
      - JAEGER_SAMPLER_TYPE=${JAEGER_SAMPLER_TYPE}
      - JAEGER_SAMPLER_PARAM=${JAEGER_SAMPLER_PARAM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${JAEGER_ADMIN_PORT}/"]
      <<: *default-healthcheck
    image: jaegertracing/jaeger:2.9.0
    networks:
      - telemetry
      - front-tier
    ports:
      - "${OTLP_GRPC_PORT}:${OTLP_GRPC_PORT}"
      - "${JAEGER_UI_PORT}:${JAEGER_UI_PORT}"
      - "${OTLP_HTTP_PORT}:${OTLP_HTTP_PORT}"
      - "${JAEGER_ADMIN_PORT}:${JAEGER_ADMIN_PORT}"
    profiles:
      - core

  # ###########################################################################
  # MQTT CLIENT
  # ###########################################################################
  mqtt-client:
    <<: *default-config
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1         # Reproducibility (CIS Docker 4.1)
        - DOCKER_BUILDKIT=1               # Enable BuildKit for security
        - OTEL_PYTHON_LOG_CORRELATION=1   # Enable trace context injection
        - OTEL_PYTHON_LOG_LEVEL=debug     # Logging level
    container_name: mqtt-client
    depends_on:
      mqtt-broker:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 256M
          pids: 1024
        reservations:
          cpus: '0.25'
          memory: 64M
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - OTEL_SERVICE_NAME=mqtt-client
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:${OTLP_GRPC_PORT}
      - OTEL_EXPORTER_OTLP_INSECURE=true    # DEVELOPMENT ONLY
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=otlp
    image: mqtt-client:0.1.0.alpha.1
    networks:
      - telemetry
    profiles:
      - core
    pull_policy: build
    volumes:
      - ${PROJECT_ROOT}/weaver/generated-code:/app/generated:ro

networks:
  back-tier:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: true
    internal: true
    ipam:
      config:
        - subnet: 10.10.0.0/24
        - subnet: fd00:10::/64

  front-tier:
    driver: bridge
    attachable: false
    enable_ipv4: true
    enable_ipv6: true
    internal: false
    ipam:
      config:
        - subnet: 10.20.0.0/24
        - subnet: fd00:20::/64

  telemetry:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: true
    internal: true
    ipam:
      config:
        - subnet: 10.30.0.0/24
        - subnet: fd00:30::/64

volumes:
  chrony-data:
  grafana-storage:
  kafka-data:
  keycloak-data:
  loki-data:
  mosquitto-data:
  mosquitto-log:
  otel-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROJECT_ROOT}/otel-collector/data
    labels:
      com.opentelemetry.description: "Persistent storage for file_storage"
      io.spdx.license: "Apache-2.0"
  prometheus-data:

configs:
  jaeger_config:
    file: ${PROJECT_ROOT}/jaeger/config.yaml
  loki_config:
    file: ${PROJECT_ROOT}/loki/config.yaml
  otel_collector_config:
    file: ${PROJECT_ROOT}/otel-collector/config.yaml
  prometheus_config:
    file: ${PROJECT_ROOT}/prometheus/config.yaml
