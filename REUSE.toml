# SPDX-FileCopyrightText: 2025 technical descent
# SPDX-License-Identifier: Apache-2.0

version = 1

# Default copyright and license - Lowest precedence
SPDX-FileCopyrightText = "2025 technical descent"
SPDX-License-Identifier = "Apache-2.0"

# Configuration and infrastructure (CC0-1.0) - Highest precedence
[[annotations]]
path = [
    "CITATION.cff",
    "coverage.xml",
    ".codespellignore",
    ".gitattributes",
    ".gitignore",
    ".dockerignore",
    ".dvcignore",
    ".github/**",
    ".pre-commit-config.yaml",
    "sbom/**",
    "**/*.bib"
]
SPDX-License-Identifier = "CC0-1.0"

# Documentation (CC-BY-4.0) - Medium precedence
[[annotations]]
path = [
    "**/*.md",
    "**/*.rst",
    "docs/**",
    "CODEOWNERS",
    "CONTRIBUTING.md",
    "SECURITY.md"
]
SPDX-License-Identifier = "CC-BY-4.0"

# Code and Complex Configuration (Apache-2.0) - Lower precedence
[[annotations]]
path = [
    "compose*.yaml",
    "Makefile",
    "policy/**",
    "pyproject.toml",
    "scripts/**",
    "src/**",
    "tests/**",
    "**/*.py",
    "**/*.rego",
]
SPDX-License-Identifier = "Apache-2.0"

# Data and Metadata (CDLA-Permissive-2.0)
[[annotations]]
path = [
    "dictionary_*.txt",
    "i18n/dictionary_*.txt",
    "croissant.json",
    "policy/data/*.json",
    "data/**"
]
SPDX-License-Identifier = "CDLA-Permissive-2.0"
