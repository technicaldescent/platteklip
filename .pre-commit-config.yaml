---
default_language_version:
  python: python3.14

default_stages: [commit-msg, pre-commit, pre-push]

minimum_pre_commit_version: 4.5.0

default_install_hook_types:
  - commit-msg
  - pre-commit
  - pre-push

repos:
  ##############################
  # META HOOKS
  ##############################
  - repo: meta
    hooks:
      - id: check-useless-excludes

  ##############################
  # SECURITY
  ##############################

  # Scan Python code for security vulnerabilities.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["--recursive", "-ll", "-ii"]
        exclude: ^tests/

  # Audit installed Python packages for known
  # vulnerabilities.
  - repo: https://github.com/trailofbits/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: Audit Python dependencies for vulnerabilities
        files: ^(requirements(-[a-zA-Z0-9]+)*\.txt|pyproject\.toml)$
        args: ["--strict"]
        pass_filenames: false

  # Detect secrets in the codebase using Gitleaks.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [commit-msg, pre-commit, pre-push]

  ##############################
  # POLICY LINTING
  ##############################

  - repo: https://github.com/open-policy-agent/regal
    rev: v0.39.0
    hooks:
      - id: regal-lint

  ##############################
  # CODE QUALITY
  ##############################

  # Remove unused code elements.
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        args:
          [
            "--remove-all-unused-imports",
            "--remove-unused-variables",
            "--in-place",
          ]

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: ["--config=pyproject.toml"]

  # Sort Python imports with Black compatibility.
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Automatically upgrade Python syntax.
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py314-plus"]

  # Exception handling.
  - repo: https://github.com/guilatrova/tryceratops
    rev: v2.4.1
    hooks:
      - id: tryceratops

  # Enforce cyclomatic complexity thresholds.
  - repo: https://github.com/rubik/xenon
    rev: v0.9.3
    hooks:
      - id: xenon
        args:
          [
            "--max-absolute=B",
            "--max-modules=A",
            "--max-average=A",
          ]

  ##############################
  # LINTING
  ##############################

  # Check the style and quality of Python code.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - --max-line-length=88
          - --ignore=E203,H601,TYP001,W503
          - "--per-file-ignores=tests/*:D403,E800,FNE005,FNE007,PT009,PT027,SCS108,SIM117"
        additional_dependencies:
          - flake8-bugbear
          - cohesion
          - flake8-comprehensions
          - flake8-docstrings
          - flake8-eradicate
          - flake8-fixme
          - flake8-functions-names
          - flake8-markdown
          - flake8-tergeo

  # Lint shell scripts for common issues.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # General-purpose pre-commit hooks for basic file
  # validation.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
        args: ["--assume-in-merge"]
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix", "lf"]
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "develop"]
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
      - id: requirements-txt-fixer
        files: ^requirements-[^-]+-[^-]+\.txt$
      - id: trailing-whitespace

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.2
    hooks:
      - id: prettier
        types_or: [css, gherkin]
        args: [--prose-wrap=always]

  # Check Python code with regex hooks.
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char

  # Automated checks on pyproject.toml.
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  # Check .feature files for Gherkin conformance.
  - repo: local
    hooks:
      - id: mandoline
        name: check gherkin feature
        description: >-
          Check feature files against Gherkin syntax
          rules.
        entry: python pre_commit_hooks/check_gherkin_feature.py
        language: system
        files: \.(feature)$
        args:
          - --languages
          - pre_commit_hooks/gherkin-languages.json
          - --strict
          - --verbose
        stages: [pre-commit, pre-push]

  ##############################
  # TYPE CHECKING
  ##############################

  # Run mypy from the local venv so it has access
  # to all project dependencies and the strict
  # config in pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: []

  ##############################
  # DOCUMENTATION
  ##############################

  # Enforce docstring coverage.
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: ["--fail-under=100", "--verbose"]

  ##############################
  # LICENSING
  ##############################

  # Check SPDX licensing information.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse-lint-file

  ##############################
  # RELEASE MANAGEMENT
  ##############################

  # Commit messages and automated versioning.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.10
    hooks:
      - id: commitizen
        stages: [commit-msg]

# Configure automated updates and autofix behaviour
# for pre-commit.ci.
ci:
  autofix_prs: true
  autofix_commit_msg: "ci(qa): apply pre-commit fixes"
  autoupdate_commit_msg: "ci(hooks): update pre-commit hooks"
  autoupdate_pr_title: "ci(hooks): update pre-commit hooks"
  autoupdate_schedule: weekly
