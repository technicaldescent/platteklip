global:
  scrape_interval: 10s
  evaluation_interval: 10s
  body_size_limit: 512KB
  scrape_timeout: 10s
  external_labels:
    cluster: "platteklip"

# ---------------------------------------------------------------------------
# Storage
# Retention settings are version-controlled here alongside scrape
# configuration and reloadable without a process restart.
# ---------------------------------------------------------------------------
storage:
  tsdb:
    retention:
      time: 2h
      size: 512MB

scrape_configs:

  # ==========================================================================
  # CORE OBSERVABILITY INFRASTRUCTURE
  # ==========================================================================

  # 1. Prometheus (Self-Monitoring) — Secured: HTTPS + mTLS
  #    Prometheus serves TLS via web-config.yml with
  #    client_auth_type: RequireAndVerifyClientCert, so the self-scrape
  #    must present a valid client certificate.
  - job_name: prometheus
    scheme: https
    metrics_path: /prometheus/metrics
    tls_config:
      ca_file: /run/secrets/ca.crt
      cert_file: /run/secrets/tls_certificate.crt
      key_file: /run/secrets/tls_private_key.key
      insecure_skip_verify: false
    static_configs:
      - targets: ["[::1]:9090"]

  # 2. Loki (Logs) — Secured: HTTPS + mTLS
  - job_name: loki
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/secrets/ca.crt
      cert_file: /run/secrets/tls_certificate.crt
      key_file: /run/secrets/tls_private_key.key
      insecure_skip_verify: false
    static_configs:
      - targets: ["loki:3100"]

  # 3. OTel Collector — Pipeline metrics exporter (port 8889).
  #    Secured: HTTPS + mTLS. This is the prometheus exporter defined in
  #    the collector's exporters section.  Exposes platteklip_* metrics
  #    that flow through the collector's metrics pipeline.
  - job_name: otel-collector
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/secrets/ca.crt
      cert_file: /run/secrets/tls_certificate.crt
      key_file: /run/secrets/tls_private_key.key
      insecure_skip_verify: false
    static_configs:
      - targets: ["otel-collector:8889"]

  # 4. OTel Collector — Internal telemetry (port 8890).
  #    Secured: HTTPS + mTLS.  The collector self-scrapes its
  #    internal metrics on localhost:8888 (plain HTTP, never
  #    network-exposed), routes them through the
  #    metrics/internal pipeline, and re-exports them on port
  #    8890 with mTLS.  Exposes otelcol_receiver_*,
  #    otelcol_exporter_*, otelcol_processor_*, and
  #    otelcol_exporter_queue_size metrics.
  - job_name: otel-collector-internal
    scheme: https
    metrics_path: /metrics
    tls_config:
      ca_file: /run/secrets/ca.crt
      cert_file: /run/secrets/tls_certificate.crt
      key_file: /run/secrets/tls_private_key.key
      insecure_skip_verify: false
    static_configs:
      - targets: ["otel-collector:8890"]

  # Jaeger internal telemetry (port 8888) uses the OTel Collector telemetry
  # framework's Prometheus reader, which does not support TLS. Scraping it
  # would require unencrypted HTTP on net-storage. Since no unencrypted
  # traffic is permitted, Jaeger is not scraped directly. Jaeger pipeline
  # health is observable via OTel Collector metrics and trace throughput.
