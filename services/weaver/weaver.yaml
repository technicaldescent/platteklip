---
whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

templates:
  - template: semconv.py.j2
    filter: >
      semconv_grouped_metrics
      | map(select(.root_namespace | startswith("edge")))
      | map({
          root_namespace: .root_namespace,
          metrics: .metrics
        })
    application_mode: single
    file_name: "edge_semconv.py"
