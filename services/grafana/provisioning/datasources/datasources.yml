---
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: https://prometheus:9090/prometheus
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: '15s'
      tlsAuth: true
      tlsAuthWithCACert: true
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: 'jaeger'
    secureJsonData:
      tlsCACert: $__file{/run/secrets/ca.crt}
      tlsClientCert: $__file{/run/secrets/tls_certificate.crt}
      tlsClientKey: $__file{/run/tls/tls_private_key.key}

  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: https://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: true
    jsonData:
      maxLines: 1000
      tlsAuth: true
      tlsAuthWithCACert: true
      derivedFields:
        - name: trace_id
          matcherRegex: "traceID=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: 'jaeger'
    secureJsonData:
      tlsCACert: $__file{/run/secrets/ca.crt}
      tlsClientCert: $__file{/run/secrets/tls_certificate.crt}
      tlsClientKey: $__file{/run/tls/tls_private_key.key}

  - name: Jaeger
    type: jaeger
    access: proxy
    orgId: 1
    url: https://jaeger:16686
    basicAuth: false
    version: 1
    editable: false
    jsonData:
      tlsAuth: true
      tlsAuthWithCACert: true
      nodeGraph:
        enabled: true
    secureJsonData:
      tlsCACert: $__file{/run/secrets/ca.crt}
      tlsClientCert: $__file{/run/secrets/tls_certificate.crt}
      tlsClientKey: $__file{/run/tls/tls_private_key.key}
