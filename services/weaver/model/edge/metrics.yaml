# Metric definitions for edge telemetry.
# Each metric maps directly to one or more PLC tags from the tag registry.
# Instruments follow OTel Semantic Conventions:
#   - gauge:     current value with no meaningful cumulative sum
#   - counter:   monotonically increasing cumulative value
#   - updowncounter: value that can increase or decrease

---
groups:

  # ---------------------------------------------------------------------------
  # HYDRAULIC PUMP
  # ---------------------------------------------------------------------------
  - id: metric.edge.pump.running
    type: metric
    metric_name: edge.pump.running
    brief: "Is the hydraulic pump motor running (1 = running, 0 = stopped)."
    instrument: gauge
    unit: "1"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

  - id: metric.edge.pump.motor.current
    type: metric
    metric_name: edge.pump.motor.current
    brief: "Hydraulic pump motor current."
    instrument: gauge
    unit: "A"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

  - id: metric.edge.pump.motor.voltage
    type: metric
    metric_name: edge.pump.motor.voltage
    brief: "Hydraulic pump motor voltage."
    instrument: gauge
    unit: "V"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

  - id: metric.edge.pump.temperature
    type: metric
    metric_name: edge.pump.temperature
    brief: >
      Hydraulic pump temperature. Currently reads all zeros —
      under investigation.
    instrument: gauge
    unit: "Cel"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id
      - ref: edge.signal.status

  - id: metric.edge.pump.dcbus.voltage
    type: metric
    metric_name: edge.pump.dcbus.voltage
    brief: "DC bus voltage shared across all VFD drives."
    instrument: gauge
    unit: "V"
    stability: development
    attributes:
      - ref: edge.vehicle.id
      - ref: edge.source.type
      - ref: edge.source.id

