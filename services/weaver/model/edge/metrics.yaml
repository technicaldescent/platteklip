  # ---------------------------------------------------------------------------
  # CONVEYOR SYSTEM
  # ---------------------------------------------------------------------------
  - id: metric.edge.conveyor.running
    type: metric
    metric_name: edge.conveyor.running
    brief: "Is the conveyor motor running (1 = running, 0 = stopped)."
    instrument: gauge
