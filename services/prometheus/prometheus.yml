---
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  body_size_limit: 512KB
  scrape_timeout: 10s

  external_labels:
    environment: 'development'
    cluster: 'system-under-test'

  metric_name_validation_scheme: "utf8"
  label_limit: 128
  label_name_length_limit: 512         # bytes
  label_value_length_limit: 2048       # bytes

scrape_configs:
  # ##########################################################################
  # OBSERVABILITY INFRASTRUCTURE
  # ##########################################################################

  #  - job_name: 'alloy'
  #    metrics_path: /metrics
  #    static_configs:
  #      - targets: ['alloy:12345']

  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'jaeger'
    metrics_path: /metrics
    static_configs:
      - targets: ['jaeger:8888']

  - job_name: 'loki'
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'otel-collector'
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
